backend:
  name: git-gateway
  branch: main # Ret til 'master' hvis dit GitHub repo bruger master

media_folder: "images"
public_folder: "/images"

collections:
  - name: "forside"
    label: "Forside Tekster"
    file: "content/forside.json"
    fields:
      - { label: "Overskrift", name: "overskrift", widget: "string" }
      - { label: "Underoverskrift", name: "underoverskrift", widget: "string" }