<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kim Nielsen — Clairvoyance, Healing &amp; Åndeaftener</title>
<meta name="description" content="Oplev hele dig. Kim Nielsen tilbyder clairvoyance, healing og åndeaftener.">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#F8F2E7',
          sand: '#EFE3CE',
          gold: {
            DEFAULT: '#C6A15B',
            light: '#DDBD84',
            dark: '#A9843F',
          },
          ink: '#2E2A22',
          stone: '#6B6355',
        },
        fontFamily: {
          serif: ['"Cormorant Garamond"', 'serif'],
          sans: ['"Jost"', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
  html { scroll-behavior: smooth; }
  .tracked { letter-spacing: 0.18em; }

  /* Hero-baggrund: mørk/gylden gradient-overlay + billede fra CMS,
     billedet sættes via CSS-variablen --hero-image i JS */
  .hero-bg {
    background-image:
      linear-gradient(90deg, rgba(248,242,231,0.92) 0%, rgba(248,242,231,0.55) 40%, rgba(248,242,231,0.05) 65%),
      var(--hero-image, none);
    background-size: cover;
    background-position: center;
  }
</style>
</head>
<body class="bg-cream text-ink font-sans antialiased">

<!-- ============ NAVIGATION ============ -->
<header class="fixed top-0 inset-x-0 z-50">
  <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 lg:px-10 py-5">
    <a href="/" id="nav-logo" class="font-serif text-xl md:text-2xl tracked uppercase text-ink">Kim Nielsen</a>

    <ul id="nav-links" class="hidden lg:flex items-center gap-8 text-xs tracked uppercase text-ink/80"></ul>

    <div class="flex items-center gap-4">
      <a id="nav-cta" href="#"
         class="hidden sm:inline-block rounded-full border border-gold-dark/60 bg-gold/90 hover:bg-gold px-6 py-2.5 text-xs tracked uppercase text-cream transition">
        Book tid
      </a>
      <button id="menu-toggle" class="lg:hidden text-ink" aria-label="Åbn menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobilmenu -->
  <div id="mobile-menu" class="hidden lg:hidden bg-cream/98 backdrop-blur border-t border-gold/20 px-6 py-6">
    <ul id="mobile-nav-links" class="flex flex-col gap-5 text-sm tracked uppercase text-ink/80"></ul>
    <a id="mobile-cta" href="#"
       class="mt-6 inline-block rounded-full border border-gold-dark/60 bg-gold px-6 py-2.5 text-xs tracked uppercase text-cream text-center w-full">
      Book tid
    </a>
  </div>
</header>

<!-- ============ HERO ============ -->
<section id="hero" class="hero-bg min-h-screen flex items-center pt-28 pb-16">
  <div class="max-w-7xl mx-auto w-full px-6 lg:px-10">
    <div class="max-w-xl">
      <p id="hero-tags" class="tracked uppercase text-gold-dark text-xs md:text-sm mb-5"></p>
      <h1 id="hero-heading" class="font-serif text-6xl sm:text-7xl md:text-8xl leading-[0.95] text-ink"></h1>
      <p id="hero-subheading" class="font-serif italic text-2xl md:text-3xl text-stone mt-6"></p>
      <p id="hero-body" class="text-stone text-base md:text-lg mt-6 max-w-sm"></p>

      <div class="flex flex-wrap items-center gap-4 mt-10">
        <a id="hero-primary-btn" href="#"
           class="rounded-full bg-gold hover:bg-gold-dark transition text-cream px-8 py-3 text-xs tracked uppercase"></a>
        <a id="hero-secondary-btn" href="#"
           class="rounded-full border border-ink/30 hover:border-ink text-ink px-8 py-3 text-xs tracked uppercase transition"></a>
      </div>
    </div>
  </div>
</section>

<script>
  async function loadForside() {
    try {
      const res = await fetch('/content/forside.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('Kunne ikke hente forside.json');
      const data = await res.json();
      renderNav(data.nav);
      renderHero(data.hero);
    } catch (err) {
      console.error('Fejl ved indlæsning af indhold:', err);
    }
  }

  function renderNav(nav) {
    if (!nav) return;
    document.getElementById('nav-logo').textContent = nav.logo || 'Kim Nielsen';

    const desktopList = document.getElementById('nav-links');
    const mobileList = document.getElementById('mobile-nav-links');
    desktopList.innerHTML = '';
    mobileList.innerHTML = '';

    (nav.links || []).forEach(link => {
      const a = document.createElement('a');
      a.href = link.url || '#';
      a.textContent = link.label || '';
      a.className = 'hover:text-gold-dark transition';

      const li = document.createElement('li');
      li.appendChild(a);
      desktopList.appendChild(li);
      mobileList.appendChild(li.cloneNode(true));
    });

    const ctaText = nav.cta_text || 'Book tid';
    const ctaUrl = nav.cta_url || '#';
    document.getElementById('nav-cta').textContent = ctaText;
    document.getElementById('nav-cta').href = ctaUrl;
    document.getElementById('mobile-cta').textContent = ctaText;
    document.getElementById('mobile-cta').href = ctaUrl;
  }

  function renderHero(hero) {
    if (!hero) return;
    document.getElementById('hero-tags').textContent = (hero.tags || []).join(' · ');
    document.getElementById('hero-heading').textContent = hero.heading || '';
    document.getElementById('hero-subheading').textContent = hero.subheading || '';
    document.getElementById('hero-body').textContent = hero.body || '';

    const primaryBtn = document.getElementById('hero-primary-btn');
    primaryBtn.textContent = hero.primary_button_text || 'Læs mere';
    primaryBtn.href = hero.primary_button_url || '#';

    const secondaryBtn = document.getElementById('hero-secondary-btn');
    secondaryBtn.textContent = hero.secondary_button_text || 'Kontakt mig';
    secondaryBtn.href = hero.secondary_button_url || '#';

    const heroSection = document.getElementById('hero');
    if (hero.background_image) {
      heroSection.style.setProperty('--hero-image', `url('${hero.background_image}')`);
    }
  }

  document.getElementById('menu-toggle').addEventListener('click', () => {
    document.getElementById('mobile-menu').classList.toggle('hidden');
  });

  loadForside();
</script>

</body>
</html>
